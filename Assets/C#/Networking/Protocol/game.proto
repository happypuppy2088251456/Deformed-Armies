syntax = "proto3";

package game.proto;

// 生成 C# 时使用的命名空间
option csharp_namespace = "Game.Protocol";

// =============================================================
//  说明
//  1) TCP：只用于“首次接入 / 房间大厅”阶段的可靠通信。
//     报文格式 = [4 字节大端长度][protobuf Envelope 序列化数据]
//  2) UDP：用于进入游戏后的实时同步（输入上行 / 快照下行）。
//     报文格式 = [2 字节魔数 0x4E4B][1 字节包类型][1 字节协议版本][protobuf 负载]
//     UDP 包类型常量见 C# 的 Game.Net.UdpPacketType（故意不放在 proto 里，
//     避免 protoc 的 C# 枚举前缀裁剪规则带来的歧义）。
// =============================================================

// -------------------------------------------------------------
// 通用枚举
// -------------------------------------------------------------

enum RejectReason {
  REJECT_REASON_UNSPECIFIED       = 0;
  REJECT_REASON_ROOM_FULL         = 1; // 房间已满
  REJECT_REASON_VERSION_MISMATCH  = 2; // 客户端版本不一致
  REJECT_REASON_GAME_ALREADY_BEGUN= 3; // 游戏已经开始
  REJECT_REASON_BAD_PASSWORD      = 4; // 房间密码错误
  REJECT_REASON_SERVER_SHUTDOWN   = 5; // 房主已关闭房间
  REJECT_REASON_DUPLICATE_NAME    = 6; // 昵称重复
}

// -------------------------------------------------------------
// TCP 统一信封（双向复用）
// 通过 oneof 区分具体消息，避免自己维护 type 字段和 cast 表。
// -------------------------------------------------------------

message Envelope {
  uint32 seq = 1; // 发送方自增序号，便于日志排查

  oneof body {
    // ---------- Client -> Host ----------
    JoinRequest  join_request  = 10; // 申请加入房间（TCP 首包）
    PlayerReady  player_ready  = 11; // 准备 / 取消准备
    Ping         ping          = 12; // 心跳与 RTT 测量
    PlayerLeave  player_leave  = 13; // 主动离开房间
    ChatMessage  chat          = 14; // 大厅聊天

    // ---------- Host -> Client ----------
    JoinAccepted  join_accepted  = 20; // 加入成功（携带 UDP 端口 / 会话令牌）
    JoinRejected  join_rejected  = 21; // 加入失败
    Pong          pong           = 22; // 心跳回包
    PlayerJoined  player_joined  = 23; // 有其他玩家加入
    PlayerLeft    player_left    = 24; // 有其他玩家离开
    RoomStateMsg  room_state     = 25; // 全量房间状态
    StartGame     start_game     = 26; // 开始游戏
    ChatMessage   chat_broadcast = 27; // 广播聊天
    Kick          kick           = 28; // 踢出房间
  }
}

// -------------------------------------------------------------
// 大厅 / 握手消息
// -------------------------------------------------------------

message JoinRequest {
  string player_name    = 1;
  string client_version = 2; // 建议填 Application.version，用于版本一致性校验
  string room_password  = 3;
}

message PlayerInfo {
  uint32 player_id   = 1;
  string player_name = 2;
  bool   ready       = 3;
  bool   is_host     = 4;
  uint32 ping_ms     = 5;
  string address     = 6; // 形如 192.168.1.3:54821
}

message JoinAccepted {
  uint32 player_id      = 1; // 房主分配的玩家 ID（从 1 开始，0 视为无效）
  string session_token  = 2; // UDP 握手凭证，防止他人冒充
  string room_name      = 3;
  uint32 udp_port       = 4; // 房主 UDP 监听端口，收到后立刻开始 UDP 握手
  uint32 tick_rate      = 5; // 每秒快照数
  uint32 max_players    = 6;
  uint64 server_time_ms = 7; // 房主单调时钟（毫秒）
  uint32 map_seed       = 8;
  repeated PlayerInfo players = 9;
}

message JoinRejected {
  RejectReason reason  = 1;
  string       message = 2;
}

message PlayerJoined { PlayerInfo player = 1; }

message PlayerLeft {
  uint32 player_id = 1;
  string reason    = 2;
}

message PlayerReady { bool ready = 1; }

message PlayerLeave { string reason = 1; }

message RoomStateMsg { repeated PlayerInfo players = 1; }

message StartGame {
  uint64 start_server_time_ms = 1;
  uint32 map_seed             = 2;
}

message Ping { uint64 sent_time_ms = 1; }

message Pong {
  uint64 sent_time_ms   = 1; // 原样回填 Ping.sent_time_ms，用于算 RTT
  uint64 server_time_ms = 2;
}

message Kick { string reason = 1; }

message ChatMessage {
  string sender = 1;
  string text   = 2;
}

// -------------------------------------------------------------
// UDP 负载
// -------------------------------------------------------------

// 客户端收到 JoinAccepted 后立刻用 (player_id, session_token) 做 UDP 握手，
// 重复发送直到收到 UdpHelloAck。这样房主才能把 UDP 端点绑定到会话上。
message UdpHello {
  uint32 player_id     = 1;
  string session_token = 2;
}

message UdpHelloAck {
  uint32 player_id      = 1;
  uint32 tick_rate      = 2;
  uint64 server_time_ms = 3;
}

// 客户端上行：一帧输入
message UdpInput {
  uint32 tick           = 1; // 客户端输入序号
  float  move_x         = 2; // -1..1
  float  move_y         = 3; // -1..1
  float  look_yaw       = 4; // 度
  float  look_pitch     = 5; // 度
  uint32 buttons        = 6; // 位掩码：1=开火 2=跳跃 4=下蹲 8=换弹 16=瞄准 ...
  uint64 client_time_ms = 7;
}

message PlayerState {
  uint32 player_id = 1;
  float  pos_x     = 2;
  float  pos_y     = 3;
  float  pos_z     = 4;
  float  yaw       = 5;
  float  pitch     = 6;
  float  vel_x     = 7;
  float  vel_y     = 8;
  float  vel_z     = 9;
  uint32 flags     = 10; // 位掩码：1=存活 2=蹲下 4=开火中 ...
  uint32 health    = 11;
  uint32 last_input_tick = 12; // 房主已处理到该玩家的哪个输入帧
}

// 房主下行：世界快照
message UdpSnapshot {
  uint32 server_tick    = 1;
  uint64 server_time_ms = 2;
  repeated PlayerState players = 3;
}

message UdpPing { uint64 sent_time_ms = 1; }

message UdpPong {
  uint64 sent_time_ms   = 1;
  uint64 server_time_ms = 2;
}

message UdpBye { string reason = 1; }
